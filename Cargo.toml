[package]
name = "heeler"
version = "0.1.0"
edition = "2024"
description = "Local workstream memory and attention for an agent living in herdr"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
rmcp = { version = "3.7", features = ["transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
